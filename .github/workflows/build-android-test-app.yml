name: Build Android Test App

on:
  push:
    paths:
      - 'android-test-app/**'
      - '.github/workflows/build-android-test-app.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk /opt/android-sdk -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found. Android SDK diagnostics:"
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            ls -la /usr/local/lib/android/sdk/cmdline-tools 2>/dev/null || true
            exit 1
          fi

          SDK_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")")"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Using Android SDK: $SDK_ROOT"
          echo "Using sdkmanager: $SDKMANAGER"

      - name: Android SDK diagnostics
        shell: bash
        run: |
          set -x
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          "$SDKMANAGER" --version
          ls -la "$ANDROID_HOME/cmdline-tools"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: "$SDKMANAGER" --verbose --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --stacktrace --info -p android-test-app assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-test-app-debug-apk
          path: android-test-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
